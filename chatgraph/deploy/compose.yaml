services:
  app:
    build:
      context: ../..
      dockerfile: chatgraph/deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 30s
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CHATGRAPH_HOST: 0.0.0.0
      CHATGRAPH_PORT: 4317
      CHATGRAPH_PUBLIC_ORIGIN: https://${CHATGRAPH_DOMAIN:?Set CHATGRAPH_DOMAIN}
      CHATGRAPH_AUTH_PASSWORD: ${CHATGRAPH_AUTH_PASSWORD:?Set a password of at least 16 characters}
      CHATGRAPH_API_BASE_URL: https://api.deepseek.com
      CHATGRAPH_MODEL: deepseek-v4-pro
      CHATGRAPH_REASONING_EFFORT: max
      CHATGRAPH_API_KEY: ${CHATGRAPH_API_KEY:?Set your provider key}
      CHATGRAPH_DATA_DIR: ${CHATGRAPH_DATA_DIR:-/data}
    volumes:
      - chatgraph_data:/data
    networks: [chatgraph]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports: ["80:80", "443:443"]
    environment:
      CHATGRAPH_DOMAIN: ${CHATGRAPH_DOMAIN:?Set CHATGRAPH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [chatgraph]
volumes:
  chatgraph_data:
  caddy_data:
  caddy_config:
networks:
  chatgraph:
