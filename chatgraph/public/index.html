<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#244d3f">
  <title>ChatGraph · 让思考留下来</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/" aria-label="ChatGraph 首页"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>ChatGraph<span class="brand-dot">.</span></span></a>
      <div class="workspace-label"><span class="avatar">L</span><span>我的思考空间<small>个人知识工作台</small></span><span class="local-badge">本地</span></div>
      <button class="primary sidebar-create" data-action="import"><span data-icon="plus"></span>整理新的对话<span class="key-hint">＋</span></button>
      <nav class="main-nav" aria-label="工作区导航"><button class="nav-item active" data-action="library"><span data-icon="grid"></span>我的图谱<span id="graph-count" class="nav-count">0</span></button><button class="nav-item" data-action="demo"><span data-icon="sparkles"></span>探索示例<span class="tiny-new">DEMO</span></button><button class="nav-item" data-action="backup"><span data-icon="shield"></span>备份与恢复</button></nav>
      <div class="library-heading">最近的思考<span data-icon="folder"></span></div>
      <label class="library-search"><span data-icon="search"></span><input id="library-search" aria-label="按标题筛选图谱" placeholder="查找图谱标题"></label><button class="text-button library-search-all" data-action="searchLibrary">搜索全部观点与原文</button>
      <button id="resume-import" class="text-button library-search-all" data-action="resumeImport" hidden></button><button id="recover-drafts" class="text-button library-search-all" data-action="recoverDrafts" hidden></button><div id="library-list" class="library-list" aria-label="已保存图谱"></div>
      <div class="sidebar-bottom"><div class="thought-card"><span data-icon="quote"></span><p>好的思考，<br>值得被再次看见。</p><small>FROM DIALOGUE TO KNOWLEDGE</small></div><button class="settings-button" data-action="settings"><span data-icon="settings"></span><span>模型与设置<small id="model-status">正在读取配置</small></span><span data-icon="chevronRight"></span></button><div class="sidebar-footer"><span class="status-dot"></span>本地工作空间<span>v0.3</span></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumbs"><button class="icon-button mobile-nav" data-action="toggleSidebar" aria-label="展开导航"><span data-icon="menu"></span></button><span data-icon="folder"></span><span>我的图谱</span><span class="crumb-divider">/</span><span id="crumb-title">正在加载</span></div><div class="topbar-actions"><span id="save-state" class="save-state">正在加载</span><button class="icon-button" data-action="history" aria-label="查看版本历史" title="版本历史"><span data-icon="clock"></span></button><button class="secondary compact" data-action="save"><span data-icon="check"></span>保存</button><div class="export-wrapper"><button class="primary compact" data-action="toggleExport"><span data-icon="upload"></span>导出<span data-icon="chevronDown"></span></button><div id="export-menu" class="dropdown export-menu" hidden><button data-action="share"><span data-icon="link"></span>创建只读分享链接</button><button data-format="markdown"><span data-icon="document"></span>Markdown 大纲<small>.md</small></button><button data-format="json"><span data-icon="code"></span>完整可编辑数据<small>.json</small></button><button data-format="html"><span data-icon="globe"></span>交互式分享页面<small>.html</small></button><button data-format="pptx"><span data-icon="document"></span>演示文稿<small>.pptx</small></button><button data-format="svg"><span data-icon="image"></span>矢量图谱<small>.svg</small></button></div></div></div></header>
      <section class="graph-heading"><div><div class="eyebrow"><span class="eyebrow-line"></span>THINK IT THROUGH. KEEP IT WITH YOU.</div><h1><button id="graph-title" title="点击修改标题" data-action="editTitle">正在打开你的思考</button><span data-icon="pencil" class="title-pencil"></span></h1><p id="graph-description">从对话里找回观点，让每一条思路都有迹可循。</p><div class="graph-meta"><span id="mode-badge" class="meta-pill"></span><span id="source-badge"></span><span class="meta-dot">·</span><span id="node-count"></span><span class="meta-dot">·</span><span id="source-count"></span></div></div><button class="new-conversation" data-action="append"><span class="new-icon" data-icon="plus"></span><span>继续这次思考<small>追加对话到当前图谱</small></span><span data-icon="arrowUpRight"></span></button></section>
      <section class="workbench">
        <div class="workbench-toolbar"><div class="view-tabs" role="tablist" aria-label="视图"><button class="view-tab active" role="tab" aria-selected="true" data-view="graph"><span data-icon="nodes"></span>思考图谱</button><button class="view-tab" role="tab" aria-selected="false" data-view="outline"><span data-icon="list"></span>结构大纲</button><button class="view-tab" role="tab" aria-selected="false" data-view="timeline"><span data-icon="clock"></span>思考轨迹</button><button class="view-tab" role="tab" aria-selected="false" data-view="source"><span data-icon="chat"></span>对话原文</button></div><div class="canvas-tools"><label class="search-control"><span data-icon="search"></span><input id="search" placeholder="搜索观点" aria-label="搜索观点或原文"><kbd>⌕</kbd></label><button class="icon-button" data-action="toggleFilters" aria-label="筛选节点" title="筛选节点"><span data-icon="filter"></span></button><button class="icon-button" data-action="fit" aria-label="适应画布" title="适应画布"><span data-icon="maximize"></span></button><button class="icon-button" data-action="toggleInspector" aria-label="切换详情面板" title="切换详情面板"><span data-icon="panel"></span></button></div></div>
        <div class="editor-actionbar"><button class="text-button" data-action="append"><span data-icon="plus"></span>追加对话</button><button class="text-button" data-action="reparent"><span data-icon="nodes"></span>调整层级</button><button class="text-button" data-action="selectAll"><span data-icon="check"></span>多选观点</button><button class="text-button" data-action="autoLayout"><span data-icon="grid"></span>自动排布</button><button class="text-button discover-relations-button" data-action="suggestRelations"><span data-icon="sparkles"></span>发现关联</button><span class="editor-action-spacer"></span><button class="icon-button" data-action="undo" title="撤销上一步" aria-label="撤销上一步"><span data-icon="undo"></span></button><button class="icon-button redo-icon" data-action="redo" title="重做上一步" aria-label="重做上一步"><span data-icon="undo"></span></button></div><div id="batch-bar" class="batch-bar" hidden></div>
        <div id="filter-bar" class="filter-bar" hidden><span>节点类型</span><select id="filter-type" aria-label="按节点类型筛选"><option value="all">全部类型</option><option value="topic">主题</option><option value="claim">观点</option><option value="evidence">依据</option><option value="question">待解问题</option><option value="action">下一步</option></select><span>判断状态</span><select id="filter-status" aria-label="按判断状态筛选"><option value="all">全部状态</option><option value="confirmed">已确认</option><option value="proposed">提议中</option><option value="rejected">已否定</option><option value="revised">已修正</option><option value="open">未解决</option></select><button class="text-button" data-action="resetFilters">重置</button><span id="filter-count"></span></div>
        <div class="workbench-body"><div class="view-area"><div id="canvas" class="canvas" tabindex="0" aria-label="交互式思考图谱"><div class="canvas-caption"><span class="status-dot"></span>一场对话，几条值得留下的思路</div><div id="world" class="graph-world"><svg id="edges" class="graph-edges" width="1" height="1" aria-label="观点关系"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#a1aea6"></path></marker></defs></svg><div id="nodes"></div></div><div id="canvas-empty" class="canvas-empty" hidden></div><div class="graph-legend"><span><i class="legend-dot claim"></i>核心观点</span><span><i class="legend-dot evidence"></i>论证依据</span><span><i class="legend-dot question"></i>待解问题</span><span><i class="legend-dot action"></i>下一步</span></div><div class="canvas-help">拖动位置 · Shift 点击多选 · ± 折叠分支</div><div class="canvas-bottom-tools"><button class="icon-button" data-action="zoomOut" aria-label="缩小"><span data-icon="minus"></span></button><span id="zoom-value">100%</span><button class="icon-button" data-action="zoomIn" aria-label="放大"><span data-icon="plus"></span></button><span class="tool-divider"></span><button class="icon-button" data-action="fit" title="适应画布" aria-label="适应画布"><span data-icon="maximize"></span></button></div><button class="add-node-button" data-action="addNode"><span data-icon="plus"></span>添加观点</button></div><div id="outline-view" class="document-view" hidden></div><div id="timeline-view" class="document-view timeline-view" hidden></div><div id="source-view" class="document-view source-view" hidden></div></div><aside id="inspector" class="inspector"></aside></div>
        <footer class="workbench-footer"><span><span data-icon="link"></span><span id="provenance-hint">观点与对话原文保持连接</span></span><span>你的判断，由你确认<span class="footer-spark">✦</span></span></footer>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="modal-root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
