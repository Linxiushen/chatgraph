name: ChatGraph Native Apps
on:
  push:
    paths: ['chatgraph/mobile/android/**', 'chatgraph/mobile/ios/**', '.github/workflows/chatgraph-native.yml']
  pull_request:
    paths: ['chatgraph/mobile/android/**', 'chatgraph/mobile/ios/**', '.github/workflows/chatgraph-native.yml']
  workflow_dispatch:
    inputs:
      default_workspace_url:
        description: 'Optional verified HTTPS workspace root; leave empty for a generic build. No passwords or tokens.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile test APK and run Android lint
        working-directory: chatgraph/mobile/android
        env:
          CHATGRAPH_DEFAULT_WORKSPACE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.default_workspace_url || '' }}
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose chatgraph/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging chatgraph/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chatgraph-android-apk
          path: |
            chatgraph/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            chatgraph/mobile/android/app/build/reports/lint-results-debug.html
          retention-days: 14
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate native inputs and Xcode source metadata
        run: bash chatgraph/mobile/ios/scripts/check-source.sh
      - name: Compile and package iPhone app and share extension without distribution signing
        working-directory: chatgraph/mobile/ios
        env:
          CHATGRAPH_DEFAULT_WORKSPACE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.default_workspace_url || '' }}
        run: bash scripts/build.sh unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: chatgraph-ios-unsigned
          path: chatgraph/mobile/ios/build/ChatGraph-unsigned.ipa
          retention-days: 14
